<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>動的ページ検証フィクスチャ</title>
    <link rel="stylesheet" href="dynamic.css">
  </head>
  <body>
    <header class="site-header">
      <span class="brand" translate="no">Dynamic Fixture</span>
      <nav aria-label="ナビゲーション">
        <a href="#feed">記事一覧</a>
        <a href="#deferred">詳細情報</a>
      </nav>
    </header>

    <main>
      <!-- A label next to a continuously animating element. The animation never
           changes text, so it must never cost a translation. -->
      <section class="motion-panel" aria-labelledby="motion-heading">
        <h2 id="motion-heading">進行状況</h2>
        <div class="motion-row">
          <span class="spinner" aria-hidden="true"></span>
          <span class="motion-label" data-probe="motion">処理中です</span>
        </div>
      </section>

      <!-- The page owns this text and keeps rewriting it. The engine must show
           the translation of whatever the page currently says, never a stale
           value, and must not fight the page for ownership. -->
      <section class="ticker-panel" aria-labelledby="ticker-heading">
        <h2 id="ticker-heading">状態</h2>
        <p class="ticker" data-probe="ticker" aria-live="off">更新中</p>
        <p class="ticker-note">ページが定期的にこの文字列を書き換えます。</p>
      </section>

      <!-- Rows are reused rather than recreated, the way a virtualised list
           recycles nodes. A recycled row must show its current text. -->
      <section class="recycler-panel" aria-labelledby="recycler-heading">
        <h2 id="recycler-heading">一覧</h2>
        <ul class="recycler">
          <li data-probe="row-0">新着</li>
          <li data-probe="row-1">完了しました</li>
          <li data-probe="row-2">詳細情報</li>
        </ul>
      </section>

      <!-- Content that only exists once the reader scrolls to it. -->
      <section class="feed-panel" id="feed" aria-labelledby="feed-heading">
        <h2 id="feed-heading">記事一覧</h2>
        <div class="feed" data-feed></div>
        <p class="feed-status" data-feed-status>読み込み中</p>
      </section>

      <!-- A section whose content is injected only when it is revealed. -->
      <section class="deferred-panel" id="deferred" aria-labelledby="deferred-heading">
        <h2 id="deferred-heading">詳細情報</h2>
        <div class="deferred" data-deferred></div>
      </section>

      <!-- Content that exists in the DOM but is not visible until the reader
           acts. Each of these reveals itself a different way, and none of them
           changes the text or the child list when it opens. -->
      <section class="reveal-panel" aria-labelledby="reveal-heading">
        <h2 id="reveal-heading">操作で開く内容</h2>
        <button type="button" data-open="dialog">確認画面を開く</button>
        <button type="button" data-open="popover">補足を開く</button>
        <button type="button" data-open="menu">メニューを開く</button>

        <!-- Opens by gaining the open attribute. -->
        <dialog class="reveal-dialog" data-reveal="dialog">
          <p data-probe="dialog-body">確認画面の本文</p>
          <button type="button" data-close="dialog">閉じる</button>
        </dialog>

        <!-- Opens by losing the hidden attribute. -->
        <div class="reveal-popover" data-reveal="popover" hidden>
          <p data-probe="popover-body">補足の本文</p>
        </div>

        <!-- Opens by a class change, which is the one an observer cannot watch
             without also seeing every animation frame on the page. -->
        <div class="reveal-menu" data-reveal="menu">
          <p data-probe="menu-body">メニューの本文</p>
        </div>
      </section>

      <!-- A same-origin frame is a separate document with its own DOM, so it
           needs its own engine or it stays an untranslated hole in the page. -->
      <section class="frame-panel" aria-labelledby="frame-heading-label">
        <h2 id="frame-heading-label">枠つき内容</h2>
        <iframe class="page-frame" data-probe="frame" src="dynamic-frame.html" title="枠つき内容" width="320" height="140"></iframe>
      </section>

      <!-- Text inside web components. A TreeWalker and a MutationObserver both
           stop at a shadow boundary, so this content is invisible unless every
           open shadow root is walked and observed in its own right. -->
      <section class="component-panel" aria-labelledby="component-heading">
        <h2 id="component-heading">部品一覧</h2>
        <jp-card data-probe="shadow-open"><span slot="note">補足説明</span></jp-card>
        <jp-closed data-probe="shadow-closed"></jp-closed>
      </section>

      <!-- Strings that live in attributes rather than text nodes. A form whose
           labels are translated but whose placeholders are not is half usable. -->
      <section class="form-panel" aria-labelledby="form-heading">
        <h2 id="form-heading">お問い合わせ</h2>
        <form class="contact-form">
          <label for="company">会社名</label>
          <input id="company" name="company" type="text" placeholder="株式会社◯◯◯◯◯" autocomplete="off">
          <label for="person">担当者名</label>
          <input id="person" name="person" type="text" placeholder="山田 太郎" autocomplete="off">
          <img class="form-mark" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="会社のロゴ" width="24" height="24">
          <button type="button" title="送信の確認">送信</button>
          <!-- Matches the protected-content rule, so it must never be sent and
               must not stop the rest of the page from being translated. -->
          <p class="secret-note" data-probe="protected">パスワードは絶対に共有しないでください</p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span data-probe="footer">補足説明</span>
    </footer>

    <script src="dynamic.js"></script>
  </body>
</html>
