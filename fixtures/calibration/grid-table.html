<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calibration Grid Table</title>
    <link rel="stylesheet" href="./calibration.css" />
  </head>
  <body>
    <main class="calibration-shell">
      <header class="calibration-header" data-calibration="header">
        <strong>Grid Table</strong>
        <nav data-calibration="nav" aria-label="Primary navigation">
          <a href="#status">進捗状況</a>
          <a href="#owner">担当者</a>
          <a href="#details">詳細を見る</a>
        </nav>
      </header>
      <h1 class="calibration-title" data-calibration="heading">進捗状況</h1>
      <section class="calibration-grid" data-calibration="grid">
        <article class="calibration-card" data-calibration="card">
          <span class="calibration-badge">新しい通知</span>
          <h2>説明文</h2>
          <p>長い説明テキストです。</p>
          <button class="calibration-action" type="button">詳細を見る</button>
        </article>
        <article class="calibration-card" data-calibration="table-card">
          <table class="calibration-table" data-calibration="table">
            <thead>
              <tr><th>担当者</th><th>進捗状況</th></tr>
            </thead>
            <tbody>
              <tr><td>会社情報</td><td>新しい通知</td></tr>
            </tbody>
          </table>
        </article>
      </section>
      <section class="calibration-divider calibration-footer">
        <p data-calibration="sibling">利用規約</p>
        <button class="calibration-critical" data-calibration="anchor" data-semantic-critical="true" type="button">確認して送信</button>
      </section>
    </main>
  </body>
</html>
