<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calibration Long Form</title>
    <link rel="stylesheet" href="./calibration.css" />
  </head>
  <body>
    <main class="calibration-shell">
      <header class="calibration-header" data-calibration="header">
        <strong>Long Form</strong>
        <nav data-calibration="nav" aria-label="Primary navigation">
          <a href="#company">会社情報</a>
          <a href="#terms">利用規約</a>
        </nav>
      </header>
      <section class="calibration-long">
        <h1 class="calibration-title" data-calibration="anchor">説明文</h1>
        <p data-calibration="paragraph">長い説明テキストです。長い説明テキストです。長い説明テキストです。</p>
        <p class="calibration-copy">長い説明テキストです。長い説明テキストです。</p>
      </section>
      <section class="calibration-divider calibration-footer">
        <p data-calibration="sibling">新しい通知</p>
        <button class="calibration-action" type="button">保存する</button>
      </section>
    </main>
  </body>
</html>
