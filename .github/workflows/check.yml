name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Build framework fixture
        run: npm run framework:build

      - name: Backend contract smoke
        run: npm run backend:smoke

      - name: Offline translation benchmark contract
        run: npm run benchmark:translation

  # The proofs that actually exercise the product were local-only, so a
  # regression in them was caught by someone remembering to run them. They need a
  # browser, but nothing else: all three drive the offline mock backend, so they
  # cost nothing and need no provider credentials.
  browser-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # An extension cannot be loaded into headless Chrome, so these run headful
      # under a virtual display, which is how a browser extension is normally
      # exercised in CI.
      - name: Prepare the browser and a display for it
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          echo "LAYOUT_TRANSLATE_CHROME=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"
          echo "LAYOUT_TRANSLATE_HEADFUL=1" >> "$GITHUB_ENV"

      - name: Build extension and fixtures
        run: |
          npm run build
          npm run framework:build

      - name: Fixture browser proof
        run: xvfb-run -a node scripts/e2e-smoke.mjs

      - name: Dynamic page proof
        run: xvfb-run -a node scripts/dynamic-smoke.mjs

      # Withholding the translations must turn those assertions red. The runner
      # fails this step if they stay green, since then they prove nothing.
      - name: Dynamic page proof cannot pass vacuously
        run: xvfb-run -a node scripts/dynamic-smoke.mjs --negative-control

      - name: Layout calibration gate
        run: xvfb-run -a node scripts/calibration-smoke.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-proof-reports
          path: |
            .output/e2e-smoke-report.json
            .output/dynamic-smoke-report.json
            .output/calibration-report.json
          if-no-files-found: warn
